<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09111e"/>
      <stop offset="52%" stop-color="#0d1e2b"/>
      <stop offset="100%" stop-color="#0a2219"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="170" cy="40" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#09111e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="1040" cy="240" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0a2219" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="64" y1="90" x2="650" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2f1ff"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="codeCardBg" x1="760" y1="42" x2="1142" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#06140f" stop-opacity="0.78"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.14"/>
    </pattern>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Main Rounded Banner -->
  <rect x="2" y="2" width="1196" height="276" rx="24" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="276" rx="24" fill="url(#dots)"/>
  <rect x="2" y="2" width="1196" height="276" rx="24" fill="url(#glowBlue)"/>
  <rect x="2" y="2" width="1196" height="276" rx="24" fill="url(#glowGreen)"/>

  <!-- Campus Eyebrow Pill (tight balanced left/right padding) -->
  <rect x="64" y="42" width="382" height="30" rx="15" fill="#0ea5e9" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="82" cy="57" r="4" fill="#4ade80"/>
  <text x="96" y="61" fill="#bae6fd" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">POLITEKNIK NEGERI JEMBER · TEKNIK INFORMATIKA</text>

  <!-- Full Name & Subtitle -->
  <text x="64" y="126" fill="url(#nameGrad)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">Ali Zaenal Abidin Al Habsyie</text>
  <text x="64" y="158" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Web, Mobile &amp; AI Enthusiast</text>

  <!-- Stack Pills -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="64" y="192" width="80" height="32" rx="16" fill="#ef4444" fill-opacity="0.15" stroke="#f87171" stroke-opacity="0.45"/>
    <text x="104" y="212.5" text-anchor="middle" fill="#fecaca">Laravel</text>

    <rect x="152" y="192" width="62" height="32" rx="16" fill="#818cf8" fill-opacity="0.16" stroke="#a5b4fc" stroke-opacity="0.45"/>
    <text x="183" y="212.5" text-anchor="middle" fill="#e0e7ff">PHP</text>

    <rect x="222" y="192" width="80" height="32" rx="16" fill="#22c55e" fill-opacity="0.15" stroke="#4ade80" stroke-opacity="0.45"/>
    <text x="262" y="212.5" text-anchor="middle" fill="#bbf7d0">Python</text>

    <rect x="310" y="192" width="66" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="343" y="212.5" text-anchor="middle" fill="#bae6fd">Dart</text>

    <rect x="384" y="192" width="78" height="32" rx="16" fill="#06b6d4" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="423" y="212.5" text-anchor="middle" fill="#cffafe">Flutter</text>

    <rect x="470" y="192" width="78" height="32" rx="16" fill="#a855f7" fill-opacity="0.16" stroke="#c084fc" stroke-opacity="0.45"/>
    <text x="509" y="212.5" text-anchor="middle" fill="#e9d5ff">MySQL</text>

    <rect x="556" y="192" width="88" height="32" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="600" y="212.5" text-anchor="middle" fill="#fde68a">Firebase</text>
  </g>

  <!-- Right Minimalist Developer Card -->
  <g filter="url(#cardShadow)">
    <rect x="742" y="40" width="396" height="200" rx="18" fill="url(#codeCardBg)" stroke="#334155" stroke-width="1.4"/>
    <circle cx="766" cy="64" r="5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="784" cy="64" r="5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="802" cy="64" r="5" fill="#22c55e" fill-opacity="0.85"/>
    <text x="1116" y="68" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">profile.json</text>
    <line x1="742" y1="84" x2="1138" y2="84" stroke="#1e293b" stroke-width="1.2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="764" y="110" fill="#64748b">{</text>
      <text x="782" y="134"><tspan fill="#38bdf8">"github"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"@happiestvrgo"</tspan><tspan fill="#64748b">,</tspan></text>
      <text x="782" y="158"><tspan fill="#38bdf8">"location"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Jember, Indonesia"</tspan><tspan fill="#64748b">,</tspan></text>
      <text x="782" y="182"><tspan fill="#38bdf8">"stack"</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#fde68a">"PHP"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fde68a">"Laravel"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fde68a">"Python"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fde68a">"Dart"</tspan><tspan fill="#94a3b8">],</tspan></text>
      <text x="782" y="206"><tspan fill="#38bdf8">"interest"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#c084fc">"AI Engineer &amp; App Dev"</tspan></text>
      <text x="764" y="228" fill="#64748b">}</text>
    </g>
  </g>
</svg>
